<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TED Dental Lab | Est. 1972 - Damascus</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-logo {
            height: 50px;
            width: auto;
            border-radius: 6px;
        }
        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.3s;
        }
        .contact-btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
        .btn-telegram {
            background-color: #0088cc;
            color: #ffffff;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
        .btn-email {
            background-color: #D8E3FF;
            color: #153377;
        }
        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #086095;
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }
        .social-icon:hover {
            background-color: #D8E3FF;
            color: #153377;
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .nav-container, .about-container, .scanner-container {
                flex-direction: column;
                text-align: center;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 15px;
            }
            .about-text h2, .scanner-text h2 {
                text-align: center !important;
            }
        }
    </style>
</head>

                </div>
            </div>
            <nav class="nav-links">

                <a href="#services" data-en="Services" data-ar="الخدمات">Services</a>
                <a href="#gallery" data-en="Aesthetic Gallery" data-ar="الحالات التجميلية">Aesthetic Gallery</a>
                <a href="#scanner" data-en="Digital Scanner" data-ar="السكنر الرقمي">Digital Scanner</a>
                <a href="#contact" data-en="Contact Us" data-ar="اتصل بنا">Contact Us</a>
                <button id="lang-toggle" onclick="toggleLanguage()">AR / EN</button>
            </nav>
        </div>
    </header>
